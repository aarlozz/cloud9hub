{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto p-8">

<a href="{% url 'task-list' %}"
   class="inline-flex items-center mb-6 px-4 py-2
          rounded-xl backdrop-blur-md bg-white/20 
          text-white border border-white/30
          hover:bg-white/30 transition-all duration-300">
    ← Back to Tasks
</a>


  <!-- Task Detail Card -->
  <div class="bg-white p-8 rounded-2xl shadow-lg">
    
    <h3 class="text-xl font-semibold mb-2 text-gray-900">{{ task.task_title }}</h3>


    <div class="space-y-3">
      <p class="text-gray-700 text-lg">
        <span class="font-semibold">Deadline:</span>
        {{ task.deadline }}
      </p>

      <p class="text-gray-700 text-lg">
        <span class="font-semibold">Rating:</span>
        {{ task.rating }}
      </p>

      {% if task.description %}
      <p class="text-gray-700 text-lg">
        <span class="font-semibold">Description:</span><br>
        {{ task.description }}
      </p>
      {% endif %}
    </div>

    <!-- Edit + Delete Buttons -->
    <div class="mt-8 flex gap-4">

      <a href="{% url 'task-update' task.id %}"
         class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition">
        Edit Task
      </a>

      <form method="post" action="{% url 'task-delete' task.id %}">
        {% csrf_token %}
        <button type="submit"
          class="bg-red-500 text-white px-6 py-2 rounded-lg hover:bg-red-600 transition">
          Delete Task
        </button>
      </form>

    </div>
  </div>

</div>
{% endblock %}
