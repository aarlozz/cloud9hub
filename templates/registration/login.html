{% extends "base.html" %}

{% block content %}
<div class="max-w-sm mx-auto mt-20 bg-white text-black rounded-2xl shadow-lg p-8">
    <h2 class="text-3xl font-bold mb-6 text-center">Login</h2>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <!-- Render form fields nicely -->
        {% for field in form %}
            <div class="flex flex-col">
                {{ field.label_tag }} 
                {{ field }}
                {% if field.errors %}
                    <p class="text-red-500 text-sm mt-1">{{ field.errors }}</p>
                {% endif %}
            </div>
        {% endfor %}
        
        <button type="submit" 
                class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-xl hover:bg-indigo-700 transition">
            Login
        </button>
    </form>

    <p class="text-center text-gray-600 mt-4">
        Don't have an account? 
        <a href="{% url 'signup' %}" class="text-indigo-600 hover:underline font-medium">Sign up here</a>
    </p>
</div>
{% endblock %}
