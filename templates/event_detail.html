{% extends "base.html" %}
{% block content %}

<div class="max-w-3xl mx-auto bg-white shadow-lg p-10 rounded-xl">

    <h1 class="text-4xl font-bold mb-4 text-gray-900">{{ event.event_title }}</h1>

    <p class="text-gray-600 mb-4">⭐ Rating: {{ event.rating }}</p>

    <p class="text-gray-700 mb-6">{{ event.description }}</p>

    <p class="text-sm text-gray-500">
        Created by: <strong>{{ event.created_by }}</strong><br>
        Created at: {{ event.created_at }}
    </p>

    <div class="flex gap-4 mt-8">
        <a href="{% url 'event-update' event.pk %}"
           class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700">
            Edit
        </a>

        <a href="{% url 'event-delete' event.pk %}"
           class="bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700">
            Delete
        </a>

        <a href="{% url 'event-list' %}"
           class="bg-gray-600 text-white px-5 py-2 rounded-lg hover:bg-gray-700">
            Back
        </a>
    </div>

</div>

{% endblock %}
