{% extends "base.html" %}
{% block content %}

<div class="max-w-xl mx-auto bg-white shadow-lg rounded-xl p-8">
    <h1 class="text-3xl font-bold mb-6 text-center">Profile Details 👤</h1>

    <div class="space-y-4">
        <p><strong>Username:</strong> {{ profile.user.username }}</p>
        <p><strong>Email:</strong> {{ profile.user.email }}</p>
        <p><strong>Pet Name:</strong> {{ profile.petname }}</p>
        <!-- Add more fields if available -->
        <!-- <p><strong>Phone:</strong> {{ profile.phone }}</p> -->
        <!-- <p><strong>Address:</strong> {{ profile.address }}</p> -->
    </div>

    <div class="mt-6 text-center">
        <a href="{% url 'profile-edit' profile.pk %}" 
           class="bg-orange-500 text-white py-2 px-5 rounded-lg hover:bg-orange-600 transition-all">
            Edit Profile
        </a>
    </div>
</div>

{% endblock %}
